<body>

<div class="login" id="login" hidden>
  <form class="login-card" id="login-form">
    <h1>Viaggi</h1>
    <p>Area privata. Inserisci la password per entrare.</p>
    <input type="text" name="username" value="viaggi" autocomplete="username" hidden>
    <label class="field" for="pw">Password</label>
    <input type="password" id="pw" autocomplete="current-password" required>
    <label class="remember"><input type="checkbox" id="remember"> Ricordami su questo dispositivo</label>
    <button type="submit" id="go">Entra</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</div>

<div id="app" hidden>
  <header class="top"><div class="wrap topbar">
    <span class="brand"><i class="ph ph-compass" aria-hidden="true"></i>Viaggi</span>
    <button class="ghost" id="logout"><i class="ph ph-sign-out" aria-hidden="true"></i>Esci</button>
  </div></header>
  <div class="wrap hello">
    <h1>Dove andiamo</h1>
    <p id="summary"></p>
  </div>
  <main class="wrap">
    <section class="list" id="upcoming"><h2>In programma</h2><div class="grid"></div></section>
    <section class="list" id="past"><h2>Già fatti</h2><div class="grid"></div></section>
  </main>
  <footer class="wrap site">I contenuti sono cifrati e vengono decifrati solo nel tuo browser.</footer>
</div>
